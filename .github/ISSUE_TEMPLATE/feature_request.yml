name: Feature request
description: Suggest a feature, an edge device for hardware scoring, or a model format.
labels: ["enhancement"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What kind of request is it?
      options:
        - New feature or improvement
        - Edge accelerator for hardware scoring
        - Model format
        - Compiler rule or auto-fix
        - AI copilot
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: What you're trying to do, and where ModelVisio falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
  - type: textarea
    id: sources
    attributes:
      label: Datasheets, benchmarks or format specs
      description: For a device, links to its TOPS, memory bandwidth, power and any MLPerf or vendor benchmark. For a format, a spec or a sample file.
