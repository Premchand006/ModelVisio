name: Desktop Release

# Cut a cross-platform release like Netron's: tag a version and CI builds
# installers for macOS (.dmg), Windows (.exe/.msi), and Linux (.AppImage/.deb/.rpm)
# and attaches them to a GitHub Release.
#
#   npm run release:desktop -- 1.0.0      # convenience wrapper, or:
#   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#
# The Release is created as a DRAFT so a single failed platform can never publish
# a half-finished release. Review it on the Releases page and click "Publish".
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        # Plain X.Y.Z (or a NUMERIC pre-release like 1.1.0-1): the Windows MSI
        # bundler rejects non-numeric pre-release tags such as "-dev"/"-beta".
        description: "Version to build, e.g. 1.0.1"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal .dmg (Apple Silicon + Intel in a single app) so the
          # website has ONE macOS download and nobody picks the wrong chip.
          # tauri-action still writes darwin-aarch64 AND darwin-x86_64 entries
          # into latest.json from it, so both kinds of Mac keep auto-updating.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Derive a clean semver (strip the `desktop-v` tag prefix) and reuse it for
      # the bundle version, the release name, and the git tag.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="desktop-v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ModelVisio $VERSION (tag $TAG)"

      # Fail in seconds, not after a ~6 min compile, if the updater signing key is
      # missing or malformed. tauri's own error for this is the cryptic
      # "failed to decode secret key: ... Missing comment in secret key".
      # The secret must be the FULL contents of the private key file written by
      # `pnpm tauri signer generate -w ~/.tauri/modelvisio.key` (one base64 line
      # that decodes to "untrusted comment: ... secret key" + the key).
      - name: Verify updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if ! printf '%s' "$KEY" | tr -d '\r\n ' | base64 -d 2>/dev/null | head -n1 | grep -q '^untrusted comment:.*secret key'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a valid Tauri private key. Paste the whole contents of the .key file (not the .pub file, not the file path)."
            exit 1
          fi
          echo "Updater signing key looks valid."

      # No `version:` input on purpose: pnpm/action-setup@v4 reads the version
      # from the root package.json `packageManager` field (pnpm@10.29.3). Pinning
      # it here too makes the action error with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Stamp the resolved version into tauri.conf.json + Cargo.toml so installers
      # are named ModelVisio_<version>_... instead of the placeholder 0.0.0.
      - name: Stamp version
        shell: bash
        run: node scripts/stamp-version.mjs "${{ steps.version.outputs.version }}"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Optional Apple Developer ID signing + notarization. Without these secrets
      # the app is ad-hoc signed (bundle.macOS.signingIdentity "-" in
      # tauri.conf.json): it opens after the user clicks "Open Anyway" once.
      # Exported ONLY when set: tauri reads them with var_os, so an EMPTY value
      # (what GitHub gives an undefined secret) still counts as present. An
      # empty APPLE_CERTIFICATE fails the keychain import and an empty
      # APPLE_SIGNING_IDENTITY overrides the ad-hoc "-".
      - name: Configure Apple signing (if secrets are set)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          put() { { echo "$1<<__APPLE_EOF__"; printf '%s\n' "$2"; echo "__APPLE_EOF__"; } >> "$GITHUB_ENV"; }
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            put APPLE_CERTIFICATE "$APPLE_CERTIFICATE"
            put APPLE_CERTIFICATE_PASSWORD "$APPLE_CERTIFICATE_PASSWORD"
            put APPLE_SIGNING_IDENTITY "$APPLE_SIGNING_IDENTITY"
            echo "Developer ID signing: on"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              put APPLE_ID "$APPLE_ID"
              put APPLE_PASSWORD "$APPLE_PASSWORD"
              put APPLE_TEAM_ID "$APPLE_TEAM_ID"
              echo "Notarization: on"
            else
              echo "Notarization: off (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID not all set)"
            fi
          else
            echo "No Apple certificate secrets, using ad-hoc signing (users click \"Open Anyway\" once)."
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update signing: signs the updater artifacts + latest.json so the
          # installed app trusts them (verified against the pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No Gemini key at build time: the desktop AI copilot is bring-your-own-key
          # (entered in the app, stored locally).
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "ModelVisio ${{ steps.version.outputs.version }}"
          releaseBody: |
            ModelVisio ${{ steps.version.outputs.version }}: neural-network model analyzer for edge deployment.

            ### Downloads
            | OS | File |
            | --- | --- |
            | **Windows** | `ModelVisio_${{ steps.version.outputs.version }}_x64-setup.exe` (or `.msi`) |
            | **macOS** (Apple Silicon + Intel) | `ModelVisio_${{ steps.version.outputs.version }}_universal.dmg` |
            | **Linux** | `.AppImage`, `.deb`, or `.rpm` |

            **macOS first launch:** open the `.dmg` and drag ModelVisio to Applications.
            The app isn't notarized yet, so macOS blocks the first launch: open it once,
            then go to **System Settings → Privacy & Security** and click **Open Anyway**
            (on macOS 14 and older, Control-click the app → Open). Terminal alternative:
            `xattr -dr com.apple.quarantine /Applications/ModelVisio.app`

            The AI copilot uses your own free Gemini API key. Click the key icon in the
            AI Copilot panel and paste it (get one at https://aistudio.google.com/apikey).
            Installed apps update themselves automatically from new releases.

            _Built automatically by the Desktop Release workflow._
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Attach a STABLE, version-independent filename for the Windows installer so
      # the website's Download button can link to a URL that never changes:
      #   /releases/latest/download/ModelVisio-Windows-x64-setup.exe
      # (always resolves to the newest PUBLISHED release). tauri-action names the
      # asset with the version (ModelVisio_1.2.3_x64-setup.exe); this uploads a
      # fixed-name copy alongside it on the same draft release.
      - name: Attach stable-named Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(find apps/desktop/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          if [ -z "$setup" ]; then echo "No NSIS installer found under bundle/nsis" >&2; exit 1; fi
          echo "Stable-naming: $setup"
          cp "$setup" "ModelVisio-Windows-x64-setup.exe"
          gh release upload "${{ steps.version.outputs.tag }}" "ModelVisio-Windows-x64-setup.exe" --clobber

      # Same idea for macOS and Linux, so the website links never change:
      #   /releases/latest/download/ModelVisio-macOS-universal.dmg
      #   /releases/latest/download/ModelVisio-Linux-x86_64.AppImage
      # The macOS step also fails the release if the .app isn't validly signed
      # (ad-hoc or Developer ID). An unsigned Apple Silicon app shows users
      # "ModelVisio is damaged and can't be opened".
      - name: Verify and attach stable-named macOS .dmg
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bundle=apps/desktop/src-tauri/target/universal-apple-darwin/release/bundle
          app="$bundle/macos/ModelVisio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          for bin in "$app"/Contents/MacOS/*; do echo "$bin: $(lipo -archs "$bin")"; done
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -n1)
          if [ -z "$dmg" ]; then echo "No .dmg found under $bundle/dmg" >&2; exit 1; fi
          echo "Stable-naming: $dmg"
          cp "$dmg" "ModelVisio-macOS-universal.dmg"
          gh release upload "${{ steps.version.outputs.tag }}" "ModelVisio-macOS-universal.dmg" --clobber

      - name: Attach stable-named Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage=$(find apps/desktop/src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -n1)
          if [ -z "$appimage" ]; then echo "No AppImage found under bundle/appimage" >&2; exit 1; fi
          echo "Stable-naming: $appimage"
          cp "$appimage" "ModelVisio-Linux-x86_64.AppImage"
          gh release upload "${{ steps.version.outputs.tag }}" "ModelVisio-Linux-x86_64.AppImage" --clobber
