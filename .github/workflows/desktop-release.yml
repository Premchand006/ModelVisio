name: Desktop Release

# Cut a cross-platform release like Netron's: tag a version and CI builds
# installers for macOS (.dmg), Windows (.exe/.msi), and Linux (.AppImage/.deb/.rpm)
# and attaches them to a GitHub Release.
#
#   npm run release:desktop -- 1.0.0      # convenience wrapper, or:
#   git tag desktop-v1.0.0 && git push origin desktop-v1.0.0
#
# The Release is created as a DRAFT so a single failed platform can never publish
# a half-finished release — review it on the Releases page and click "Publish".
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        # Plain X.Y.Z (or a NUMERIC pre-release like 1.1.0-1): the Windows MSI
        # bundler rejects non-numeric pre-release tags such as "-dev"/"-beta".
        description: "Version to build, e.g. 1.0.1"
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (M-series)
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Derive a clean semver (strip the `desktop-v` tag prefix) and reuse it for
      # the bundle version, the release name, and the git tag.
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="desktop-v${VERSION}"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#desktop-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building ModelVisio $VERSION (tag $TAG)"

      # Fail in seconds, not after a ~6 min compile, if the updater signing key is
      # missing or malformed. tauri's own error for this is the cryptic
      # "failed to decode secret key: ... Missing comment in secret key".
      # The secret must be the FULL contents of the private key file written by
      # `pnpm tauri signer generate -w ~/.tauri/modelvisio.key` (one base64 line
      # that decodes to "untrusted comment: ... secret key" + the key).
      - name: Verify updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if ! printf '%s' "$KEY" | tr -d '\r\n ' | base64 -d 2>/dev/null | head -n1 | grep -q '^untrusted comment:.*secret key'; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not a valid Tauri private key. Paste the whole contents of the .key file (not the .pub file, not the file path)."
            exit 1
          fi
          echo "Updater signing key looks valid."

      # No `version:` input on purpose — pnpm/action-setup@v4 reads the version
      # from the root package.json `packageManager` field (pnpm@10.29.3). Pinning
      # it here too makes the action error with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Stamp the resolved version into tauri.conf.json + Cargo.toml so installers
      # are named ModelVisio_<version>_... instead of the placeholder 0.0.0.
      - name: Stamp version
        shell: bash
        run: node scripts/stamp-version.mjs "${{ steps.version.outputs.version }}"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Auto-update signing: signs the updater artifacts + latest.json so the
          # installed app trusts them (verified against the pubkey in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # No Gemini key at build time: the desktop AI copilot is bring-your-own-key
          # (entered in the app, stored locally).
        with:
          projectPath: apps/desktop
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: "ModelVisio ${{ steps.version.outputs.version }}"
          releaseBody: |
            ModelVisio ${{ steps.version.outputs.version }} — AI-native neural-network model analyzer for edge deployment.

            ### Downloads
            | OS | File |
            | --- | --- |
            | **Windows** | `ModelVisio_${{ steps.version.outputs.version }}_x64-setup.exe` (or `.msi`) |
            | **macOS** (Apple Silicon) | `ModelVisio_${{ steps.version.outputs.version }}_aarch64.dmg` |
            | **macOS** (Intel) | `ModelVisio_${{ steps.version.outputs.version }}_x64.dmg` |
            | **Linux** | `.AppImage`, `.deb`, or `.rpm` |

            The AI copilot uses your own free Gemini API key — click the key icon in the
            AI Copilot panel and paste it (get one at https://aistudio.google.com/apikey).
            Installed apps update themselves automatically from new releases.

            _Built automatically by the Desktop Release workflow._
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Attach a STABLE, version-independent filename for the Windows installer so
      # the website's Download button can link to a URL that never changes:
      #   /releases/latest/download/ModelVisio-Windows-x64-setup.exe
      # (always resolves to the newest PUBLISHED release). tauri-action names the
      # asset with the version (ModelVisio_1.2.3_x64-setup.exe); this uploads a
      # fixed-name copy alongside it on the same draft release.
      - name: Attach stable-named Windows installer
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(find apps/desktop/src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          if [ -z "$setup" ]; then echo "No NSIS installer found under bundle/nsis" >&2; exit 1; fi
          echo "Stable-naming: $setup"
          cp "$setup" "ModelVisio-Windows-x64-setup.exe"
          gh release upload "${{ steps.version.outputs.tag }}" "ModelVisio-Windows-x64-setup.exe" --clobber
