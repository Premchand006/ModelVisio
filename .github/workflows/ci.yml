name: CI

# Typecheck every workspace package and run the unit tests (parsers, core, ai,
# vscode), build the web app, and package the VS Code extension.
# Fast (~1 min) and needs no secrets, so it runs on every push and PR — including
# PRs from forks.
on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web app
        run: pnpm build

      # Builds the host (esbuild) + webview (vite) and runs vsce package. Catches
      # .vscodeignore / manifest mistakes that typecheck and tests can't see.
      - name: Build + package VS Code extension
        run: pnpm --filter modelvisio-vscode package

      - name: Upload VS Code extension (.vsix)
        uses: actions/upload-artifact@v4
        with:
          name: modelvisio-vsix
          path: apps/vscode/modelvisio.vsix
          if-no-files-found: error
          retention-days: 14
