name: Desktop Build Check

# Compile + bundle the Tauri desktop app on all three OSes WITHOUT publishing a
# release. Use this to verify the Rust side builds on every OS before tagging a
# real release. Runs on manual dispatch and on PRs touching the desktop app.
#
# Updater signing is deliberately OFF here (src-tauri/tauri.ci.conf.json):
# GitHub never passes secrets to PRs from forks, so TAURI_SIGNING_PRIVATE_KEY is
# empty there and `tauri build` dies with "failed to decode secret key". Signing
# only matters for real releases, which desktop-release.yml handles.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-build-check.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose — pnpm/action-setup@v4 reads the version
      # from the root package.json `packageManager` field (pnpm@10.29.3). Pinning
      # it here too makes the action error with ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No tagName → tauri-action only builds the installers; it does NOT create a
      # GitHub Release. The CI config overlay disables updater artifacts so no
      # signing key is needed (works for fork PRs, which get no secrets).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --config src-tauri/tauri.ci.conf.json
